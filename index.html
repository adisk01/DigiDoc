<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiDoc — Konsol dokter</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;--ink:#1C2430;--ink-2:#5B6470;--rule:#E3E5E8;--well:#F1F2F0;--teal:#177B6F;
  --r-emergency-bg:#FBE3E1;--r-emergency:#8E1E14;
  --r-urgent-bg:#FBEDD2;--r-urgent:#7A4A05;
  --r-handoff-bg:#EBE6F8;--r-handoff:#4A3A8A;
  --r-review-bg:#E6ECF3;--r-review:#2F4A6B;
  --r-specialist-bg:#DFF0EC;--r-specialist:#135F55;
  --r-routine-bg:#E6F1E1;--r-routine:#2F5E22;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:13px/1.5 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:1px solid var(--rule);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ink-2)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
button.primary:hover{background:#136559}
button[disabled]{opacity:.5;cursor:default}
select{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff}

.top{display:flex;align-items:center;gap:16px;height:48px;padding:0 20px;border-bottom:1px solid var(--rule);background:#fff}
.top .brand{font-weight:600;font-size:15px}
.top .clinic{color:var(--ink-2)}
.top .spacer{flex:1}
.top label{display:flex;align-items:center;gap:8px;color:var(--ink-2)}

.shell{display:grid;grid-template-columns:280px 1fr;height:calc(100% - 48px)}
.queue{border-right:1px solid var(--rule);overflow:auto;background:#fff}
.queue h2{margin:0;padding:14px 16px 8px;font-size:15px;font-weight:600}
.queue .row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 16px 10px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--rule);cursor:pointer}
.queue .row:hover{background:var(--well)}
.queue .row.active{background:var(--well)}
.queue .row.emergency{border-left-color:var(--r-emergency)}
.queue .row.human_handoff_now{border-left-color:var(--r-handoff)}
.queue .row .id{font-weight:500}
.queue .row .who{color:var(--ink-2);grid-column:1/-1}
.queue .row .age{color:var(--ink-2);font-size:12px}
.queue .empty{padding:24px 16px;color:var(--ink-2)}

.case{overflow:auto;padding:24px 32px 64px;max-width:900px}
.case h1{margin:0 0 6px;font-size:20px;font-weight:600}
.case .meta{color:var(--ink-2);margin-bottom:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;vertical-align:middle}
.badge.emergency{background:var(--r-emergency-bg);color:var(--r-emergency)}
.badge.urgent_same_day{background:var(--r-urgent-bg);color:var(--r-urgent)}
.badge.human_handoff_now{background:var(--r-handoff-bg);color:var(--r-handoff)}
.badge.clinician_review{background:var(--r-review-bg);color:var(--r-review)}
.badge.specialist_route{background:var(--r-specialist-bg);color:var(--r-specialist)}
.badge.routine{background:var(--r-routine-bg);color:var(--r-routine)}
.badge.mode{background:var(--well);color:var(--ink-2)}
.badge.abstain{background:var(--r-urgent-bg);color:var(--r-urgent)}
.hits{display:inline;color:var(--ink-2);margin-left:8px}

.banner{margin:0 0 16px;padding:10px 12px;border:1px solid var(--r-urgent);border-radius:6px;background:var(--r-urgent-bg);color:var(--r-urgent)}

section{margin-top:28px}
section h2{margin:0 0 10px;font-size:15px;font-weight:600}
.well{background:var(--well);border-radius:6px;padding:12px 14px;white-space:pre-wrap}
.well.danger{background:#fff;border:1px solid var(--r-emergency);color:var(--r-emergency)}
.well .cap{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}

.rule{border:1px solid var(--rule);border-radius:6px;padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
.rule .rid{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.rule .name{font-weight:500;grid-column:1}
.rule .why{color:var(--ink-2);grid-column:1}
.rule .src{font-size:11px;color:var(--ink-2);grid-column:1}
.rule .route{grid-column:2;grid-row:1/span 4;align-self:start}

.fields{display:grid;grid-template-columns:180px 1fr 120px;gap:6px 16px;align-items:center}
.fields .k{color:var(--ink-2)}
.fields .v{}
.conf{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.conf i{display:block;height:100%;background:var(--teal)}
.conf.low i{background:var(--r-urgent)}
.list{margin:0;padding-left:18px}
.list li{margin:4px 0}

.draft p{max-width:70ch;margin:8px 0}
.cite{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;font-size:10px;font-weight:600;border:1px solid var(--rule);border-radius:3px;margin-left:3px;vertical-align:super;cursor:pointer;background:#fff}
.cite:hover{border-color:var(--teal);color:var(--teal)}
.soap{display:grid;grid-template-columns:32px 1fr;gap:6px 12px;max-width:70ch}
.soap b{font-weight:600;color:var(--ink-2)}
.codes span{display:inline-block;border:1px solid var(--rule);border-radius:4px;padding:2px 8px;margin:0 6px 6px 0;font-size:12px}
.codes span b{font-weight:600;margin-right:6px}

.actions{display:flex;gap:8px;align-items:center;padding-top:20px;margin-top:28px;border-top:1px solid var(--rule)}
.actions .spacer{flex:1}
.signed{border-left:3px solid var(--teal);padding-left:12px;color:var(--ink-2)}

.log{color:var(--ink-2)}
.log div{padding:4px 0;border-bottom:1px solid var(--rule)}
.log time{display:inline-block;width:64px}

.panel{position:fixed;top:48px;right:0;bottom:0;width:360px;background:#fff;border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .18s ease;padding:20px;overflow:auto}
.panel.open{transform:none}
.panel h3{margin:0 0 4px;font-size:15px;padding-right:72px}
.panel .src{font-size:12px;color:var(--ink-2);margin-bottom:12px}
.panel .close{position:absolute;top:12px;right:12px}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.queue{display:none}.case{padding:16px}}
</style>
</head>
<body>

<header class="top">
  <span class="brand">DigiDoc</span>
  <span class="clinic">Klinik Sehat Sejahtera · Semarang</span>
  <span class="spacer"></span>
  <label>Model <select id="modelMode"><option value="real">real</option><option value="mock" selected>mock</option><option value="off">nonaktif</option></select></label>
  <button id="seed">Seed demo</button>
</header>

<div class="shell">
  <aside class="queue">
    <h2>Antrian</h2>
    <div id="queue"></div>
  </aside>
  <main class="case" id="case"></main>
</div>

<aside class="panel" id="panel" aria-hidden="true">
  <button class="close" id="panelClose" aria-label="Tutup">Tutup</button>
  <h3 id="panelTitle"></h3>
  <div class="src" id="panelSrc"></div>
  <div id="panelBody" style="white-space:pre-wrap"></div>
</aside>

<script>
// ---------------------------------------------------------------------------
// MOCK — Cursor: replace every read of MOCK with fetch() to the routes in
// BUILD-PLAN step 6. Keep the render functions; they are the design.
// ---------------------------------------------------------------------------
const ROUTE_LABEL = {emergency:"Darurat", urgent_same_day:"Hari ini", human_handoff_now:"Tim manusia",
  clinician_review:"Tinjauan dokter", specialist_route:"Rujuk spesialis", routine:"Rutin"};

const MOCK = {
  queue: [
    {id:"S2", route:"emergency", who:"Laki-laki, 28", age:"2 mnt"},
    {id:"S10", route:"emergency", who:"Laki-laki, 55", age:"3 mnt"},
    {id:"S8", route:"human_handoff_now", who:"—", age:"5 mnt"},
    {id:"S5", route:"urgent_same_day", who:"Bayi, 8 bln", age:"7 mnt"},
    {id:"S6", route:"urgent_same_day", who:"Perempuan, 29, hamil 30 mgg", age:"9 mnt"},
    {id:"S3", route:"clinician_review", who:"Perempuan, 52", age:"14 mnt"},
    {id:"S7", route:"clinician_review", who:"Laki-laki, 40", age:"18 mnt"},
    {id:"S9", route:"clinician_review", who:"Perempuan, 38", age:"21 mnt"},
    {id:"S12", route:"clinician_review", who:"Laki-laki, 45", age:"25 mnt"},
    {id:"S4", route:"specialist_route", who:"Laki-laki, 67", age:"30 mnt"},
    {id:"S1", route:"routine", who:"Perempuan, 34", age:"33 mnt"},
    {id:"S11", route:"routine", who:"Perempuan, 34", age:"35 mnt", degraded:true},
  ],
  cases: {
    S3: {
      id:"S3", route:"clinician_review", who:"Perempuan, 52", age:"14 menit yang lalu", signed:null, degraded:false,
      message:"Kaki saya ada luka di jempol, sudah 2 minggu tidak sembuh, agak bau. Saya punya gula. Umur 52, perempuan. Minum metformin tapi sering lupa. Sudah dikasih ramuan herbal di lukanya.",
      hits:[
        {rule_id:"R09_DIABETIC_FOOT", name:"Luka kaki pada pasien diabetes", reason:"Kaki diabetik mengancam tungkai dan bergantung pada pemeriksaan fisik; ringkasan untuk dokter, tanpa rencana.", guideline:"PERKENI_KAKI_DIABETIK_2021 §assessment; IWGDF_2023 §classification", route:"clinician_review"},
        {rule_id:"R10_WOUND_GENERAL", name:"Luka tidak sembuh / berbau", reason:"Luka perlu dilihat langsung.", guideline:"KEMENKES_PPK_FKTP_2022 §wounds", route:"clinician_review"}
      ],
      notes:["Probe-to-bone, kedalaman, nekrosis, luas selulitis, nadi. Pertimbangkan HbA1c. Tanyakan obat oles/ramuan."],
      intake:{
        fields:[
          ["Pasien", "Diri sendiri", .98], ["Usia", "52", .97], ["Jenis kelamin", "Perempuan", .95],
          ["Kehamilan", "Tidak berlaku", .9], ["Operasi ≤30 hari", "Tidak", .85], ["Alat implan", "Tidak ada", .85],
          ["Penyakit kronis", "Diabetes", .96], ["Obat", "Metformin (tidak teratur)", .9], ["Alergi", "Belum ditanya", .4],
          ["Keluhan utama", "Luka kaki tidak sembuh pada pasien diabetes", .93], ["Durasi", "14 hari", .95],
          ["Gejala", "foot_wound · wound_nonhealing · wound_foul", .9]
        ],
        unparsed:["ramuan herbal"], injected:[]
      },
      draft:{
        mode:"summary", abstain:false, confidence:.78,
        assessment:"Ulkus kaki diabetik pada jempol kaki, 14 hari, dengan bau — kemungkinan terinfeksi.[1] Kontrol glikemik kemungkinan buruk (metformin tidak teratur, HbA1c terakhir >3 bulan).[2] Ramuan herbal pada luka dapat menutupi tanda infeksi dan perlu dihentikan sebelum pemeriksaan.[3]",
        differentials:["Ulkus kaki diabetik terinfeksi (ringan–sedang)", "Osteomielitis — jika probe-to-bone positif", "Iskemia tungkai — periksa nadi dorsalis pedis"],
        examine:["Probe-to-bone", "Kedalaman dan jaringan nekrotik", "Luas selulitis (cm)", "Tanda sistemik (demam, takikardia)", "Nadi perifer", "HbA1c dan GDS"],
        plan:[], soap:{S:"Luka jempol kaki 14 hari, berbau, DM tipe 2, metformin tidak teratur, ramuan herbal topikal.", O:"— (belum diperiksa)", A:"Suspek ulkus kaki diabetik terinfeksi; perlu pemeriksaan langsung.", P:""},
        icd10:[{code:"E11.621", label:"DM tipe 2 dengan ulkus kaki"}, {code:"L97.519", label:"Ulkus kronis kaki, tidak spesifik"}],
        citations:{1:{key:"PERKENI_KAKI_DIABETIK_2021", section:"assessment", title:"Penilaian awal ulkus kaki diabetik", text:"Setiap ulkus kaki pada pasien diabetes dinilai untuk: durasi, kedalaman, tanda infeksi lokal (eritema, edema, nyeri, bau, pus), tanda sistemik, dan status vaskular. Bau dan sekret merupakan tanda infeksi lokal…"},
                   2:{key:"PERKENI_KAKI_DIABETIK_2021", section:"glycaemic", title:"Kontrol glikemik pada ulkus", text:"Penyembuhan luka memburuk pada HbA1c tinggi. Periksa HbA1c bila tidak ada hasil dalam 3 bulan terakhir…"},
                   3:{key:"KEMENKES_PPK_FKTP_2022", section:"wounds", title:"Tata laksana luka di FKTP", text:"Hentikan bahan topikal non-medis; bersihkan luka sebelum penilaian agar tanda infeksi tidak tertutup…"}}
      },
      layer2:{available:["diabetic_foot"], result:null},
      log:[{t:"09:41", who:"sistem", what:"Kasus dibuat · rute: tinjauan dokter · pesan safety-net terkirim (wound_come_in)"}]
    }
  },
  prescreen: {S4:["Pusing berat / pingsan? — Tidak", "Berdebar tidak teratur? — Tidak", "Kejutan dari alat? — Tidak", "Bengkak di lokasi alat? — Tidak", "Obat baru? — Tidak"]}
};

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
let activeId = "S3";

function renderQueue(items){
  const el = document.getElementById("queue");
  if(!items.length){ el.innerHTML = '<div class="empty">Belum ada kasus. Kirim pesan dari halaman pasien atau tekan Seed demo.</div>'; return; }
  el.innerHTML = items.map(c => `
    <div class="row ${c.route} ${c.id===activeId?'active':''}" data-id="${c.id}" tabindex="0" role="button">
      <span class="id">${c.id}</span><span class="age">${c.age}</span>
      <span class="who">${c.who} · ${ROUTE_LABEL[c.route]}${c.degraded?' · tanpa draf':''}</span>
    </div>`).join("");
  el.querySelectorAll(".row").forEach(r => r.addEventListener("click", () => openCase(r.dataset.id)));
}

function cite(n){ return `<span class="cite" data-cite="${n}" role="button" tabindex="0">${n}</span>`; }
function withCites(text){ return text.replace(/\[(\d+)\]/g, (_, n) => cite(n)); }

function renderCase(c){
  const el = document.getElementById("case");
  if(!c){ el.innerHTML = '<p style="color:var(--ink-2)">Pilih kasus di antrian.</p>'; return; }
  const noDraftRoutes = {emergency:"pasien sudah diarahkan ke IGD.", urgent_same_day:"pasien sudah diarahkan ke fasilitas kesehatan hari ini.", human_handoff_now:"tim sudah dihubungi untuk kontak langsung."};
  const d = c.draft;
  let draftHtml = "";
  if(c.degraded){
    draftHtml = `<p class="badge mode">Model nonaktif</p><p>Draf tidak dibuat. Data intake mentah ada di atas.</p>`;
  } else if(noDraftRoutes[c.route]){
    draftHtml = `<p>Tidak ada draf — ${noDraftRoutes[c.route]}</p>`;
  } else if(d){
    const modeLabel = d.abstain ? '<span class="badge abstain">Abstain</span>' : `<span class="badge mode">${d.mode==="plan"?"Rencana":"Ringkasan"}</span>`;
    draftHtml = `
      <div class="draft">
        <p>${modeLabel} <span style="color:var(--ink-2);margin-left:8px">keyakinan ${Math.round(d.confidence*100)}%</span></p>
        ${d.abstain_reason?`<p style="color:var(--r-urgent)">${d.abstain_reason}</p>`:""}
        <p>${withCites(d.assessment)}</p>
        <h2 style="margin-top:16px">Diagnosis banding</h2>
        <ul class="list">${d.differentials.map(x=>`<li>${x}</li>`).join("")}</ul>
        ${d.examine?.length?`<h2 style="margin-top:16px">Yang perlu diperiksa / diperiksa lab</h2><ul class="list">${d.examine.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
        ${d.plan?.length?`<h2 style="margin-top:16px">Rencana</h2><ul class="list">${d.plan.map(p=>`<li>${p.text}${cite(p.cite)}</li>`).join("")}</ul>`:""}
        <h2 style="margin-top:16px">SOAP</h2>
        <div class="soap">${["S","O","A","P"].map(k=>`<b>${k}</b><span>${d.soap[k]||"—"}</span>`).join("")}</div>
        <h2 style="margin-top:16px">ICD-10</h2>
        <div class="codes">${d.icd10.map(x=>`<span><b>${x.code}</b>${x.label}</span>`).join("")}</div>
      </div>`;
  }

  const l2 = c.layer2?.result;
  const l2Html = l2 ? `
    <section><h2>Hasil konsul spesialis · ${l2.module}</h2>
      <p><b>${l2.grade.system} ${l2.grade.value}</b> — kriteria terpenuhi: ${l2.grade.criteria_met.join(", ")}</p>
      <p>Rujukan: <span class="badge ${l2.referral==="urgent"?"urgent_same_day":l2.referral==="emergency"?"emergency":"routine"}">${l2.referral}</span> — ${l2.referral_reason}</p>
      ${l2.override?`<p style="color:var(--r-urgent)">Tingkat rujukan ditetapkan oleh aturan, bukan model (model menyarankan ${l2.model_said}).</p>`:""}
      <h2 style="margin-top:12px">Mulai sekarang</h2><ul class="list">${l2.start_now.map(s=>`<li>${s.text}${cite(s.cite)}</li>`).join("")}</ul>
      <h2 style="margin-top:12px">Poin surat rujukan</h2><ul class="list">${l2.referral_letter_points.map(s=>`<li>${s}</li>`).join("")}</ul>
    </section>` : "";

  const pre = MOCK.prescreen[c.id];

  el.innerHTML = `
    ${c.degraded?`<div class="banner">Drafting mati. Kasus masuk antrian tanpa draf.</div>`:""}
    <h1>Kasus ${c.id} · ${c.who}</h1>
    <div class="meta">${c.age}</div>
    <div><span class="badge ${c.route}">${ROUTE_LABEL[c.route]}</span><span class="hits">${c.hits.map(h=>h.rule_id).join(" · ")||"tidak ada aturan terpicu"}</span></div>

    <div class="${c.signed?'signed':''}" style="margin-top:8px">
    <section><h2>Pesan pasien</h2><div class="well">${c.message}</div></section>

    <section><h2>Hasil gate</h2>
      ${c.hits.length ? c.hits.map(h=>`
        <div class="rule">
          <span class="rid">${h.rule_id}</span>
          <span class="badge ${h.route} route">${ROUTE_LABEL[h.route]}</span>
          <span class="name">${h.name}</span>
          <span class="why">${h.reason}</span>
          <span class="src">${h.guideline}</span>
        </div>`).join("") : `<p style="color:var(--ink-2)">Tidak ada aturan terpicu. Draf diizinkan.</p>`}
      ${c.notes?.length?`<p style="color:var(--ink-2)">Catatan untuk dokter: ${c.notes.join(" ")}</p>`:""}
    </section>

    ${pre?`<section><h2>Jawaban pra-skrining</h2><ul class="list">${pre.map(x=>`<li>${x}</li>`).join("")}</ul></section>`:""}

    <section><h2>Data terstruktur</h2>
      <div class="fields">${c.intake.fields.map(([k,v,conf])=>`<span class="k">${k}</span><span class="v">${v}</span><span class="conf ${conf<0.6?'low':''}" title="keyakinan ${Math.round(conf*100)}%"><i style="width:${conf*100}%"></i></span>`).join("")}</div>
      ${c.intake.unparsed?.length?`<div class="well" style="margin-top:12px"><span class="cap">Tidak terurai — teks asli</span>${c.intake.unparsed.map(s=>`“${s}”`).join("  ")}</div>`:""}
      ${c.intake.injected?.length?`<div class="well danger" style="margin-top:12px"><span class="cap">Teks yang ditujukan ke sistem (diabaikan oleh gate)</span>${c.intake.injected.map(s=>`“${s}”`).join("  ")}</div>`:""}
    </section>

    <section><h2>Draf untuk dokter</h2>${draftHtml}</section>
    ${l2Html}
    </div>

    <div class="actions">
      ${c.signed ? `<span class="signed">Ditandatangani oleh ${c.signed.by} pada ${c.signed.at}</span>` : `
        <button data-act="accept">Terima</button>
        <button data-act="edit">Ubah</button>
        <button data-act="reject">Tolak</button>
        <span class="spacer"></span>
        ${c.layer2?.available?.length?`<button data-act="consult">Konsul spesialis · ${c.layer2.available[0].replace("_"," ")}</button>`:""}
        <button class="primary" data-act="sign">Tanda tangan</button>`}
    </div>

    <section><h2>Riwayat tindakan</h2><div class="log">${c.log.map(l=>`<div><time>${l.t}</time>${l.who} — ${l.what}</div>`).join("")}</div></section>
  `;

  el.querySelectorAll("[data-cite]").forEach(s => s.addEventListener("click", () => openCite(c, s.dataset.cite)));
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(c, b.dataset.act)));
}

function openCite(c, n){
  const src = c.draft?.citations?.[n] || c.layer2?.result?.citations?.[n];
  if(!src) return;
  document.getElementById("panelTitle").textContent = src.title;
  document.getElementById("panelSrc").textContent = `${src.key} §${src.section}`;
  document.getElementById("panelBody").textContent = src.text;
  const p = document.getElementById("panel"); p.classList.add("open"); p.setAttribute("aria-hidden","false");
}
document.getElementById("panelClose").addEventListener("click", () => { const p=document.getElementById("panel"); p.classList.remove("open"); p.setAttribute("aria-hidden","true"); });

function act(c, action){
  // Cursor: POST /case/{id}/action. Below is the mock behaviour so the static page demonstrates every state.
  const now = new Date().toTimeString().slice(0,5);
  if(action==="sign"){
    const name = prompt("Tanda tangani sebagai dr. …? Kasus tidak bisa diubah setelah ini.\nNama dokter:");
    if(!name) return;
    c.signed = {by:`dr. ${name}`, at:now};
    c.log.push({t:now, who:`dr. ${name}`, what:"Tanda tangan · kasus dibekukan"});
  } else if(action==="consult"){
    c.layer2.result = {
      module:"diabetic_foot", grade:{system:"Wagner", value:"3", criteria_met:["ulkus dalam", "probe-to-bone positif", "jaringan nekrotik"]},

    c.log.push({t:now, who:"dr.", what:"Konsul spesialis · diabetic_foot · temuan: PTB+, nekrosis, dalam, selulitis 3 cm"});
  } else {

  renderCase(c);
}

function openCase(id){
  activeId = id;
  renderQueue(MOCK.queue);
  renderCase(MOCK.cases[id] || null);
  if(!MOCK.cases[id]) document.getElementById("case").innerHTML = `<p style="color:var(--ink-2)">Kasus ${id} — data contoh hanya tersedia untuk S3 di halaman statis ini. Cursor: GET /case/${id}.</p>`;
}

renderCase(MOCK.cases.S3);
